name: IndexNow URL notification

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "sitemap.xml"
      - "image-sitemap.xml"
      - "robots.txt"
      - "photos/**"
      - "3bb471a4632e682c1ee3ce7ac3044218bc09def9191f8f7679b68.txt"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pusoai-indexnow
  cancel-in-progress: false

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published URL list
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify IndexNow key is publicly available
        env:
          INDEXNOW_KEY: "3bb471a4632e682c1ee3ce7ac3044218bc09def9191f8f7679b68"
        run: |
          key_url="https://pusoai.online/${INDEXNOW_KEY}.txt"
          for attempt in {1..20}; do
            published="$(curl --fail --silent --show-error "$key_url" 2>/dev/null || true)"
            if [ "$published" = "$INDEXNOW_KEY" ]; then
              echo "IndexNow key is publicly available."
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment (attempt $attempt/20)..."
            sleep 15
          done
          echo "The IndexNow key is not publicly available after 5 minutes."
          exit 1

      - name: Submit canonical sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: "3bb471a4632e682c1ee3ce7ac3044218bc09def9191f8f7679b68"
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const sitemap = fs.readFileSync('sitemap.xml', 'utf8');
          const urls = [...sitemap.matchAll(/<loc>\s*(https:\/\/pusoai\.online\/[^<]+)\s*<\/loc>/gi)]
            .map(match => match[1].trim())
            .filter((url, index, all) => all.indexOf(url) === index);

          if (!urls.length) throw new Error('No PusoAI canonical URLs were found in sitemap.xml.');

          const key = process.env.INDEXNOW_KEY;
          const keyLocation = `https://pusoai.online/${key}.txt`;
          const batches = Array.from(
            { length: Math.ceil(urls.length / 10000) },
            (_, index) => urls.slice(index * 10000, (index + 1) * 10000)
          );

          (async () => {
            for (const urlList of batches) {
              const response = await fetch('https://api.indexnow.org/indexnow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify({
                  host: 'pusoai.online',
                  key,
                  keyLocation,
                  urlList
                })
              });
              const body = await response.text();
              console.log(`IndexNow HTTP ${response.status}; submitted ${urlList.length} URLs; response: ${body}`);
              if (![200, 202].includes(response.status)) {
                throw new Error(`IndexNow rejected the URL batch with HTTP ${response.status}`);
              }
            }
            console.log(`IndexNow accepted ${urls.length} canonical sitemap URLs.`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
