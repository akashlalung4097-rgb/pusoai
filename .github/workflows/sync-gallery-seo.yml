name: Sync PusoAI gallery SEO pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "robots.txt"
      - "llms.txt"
      - "sitemap.xml"
      - "favicon.svg"
      - ".github/workflows/sync-gallery-seo.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: pusoai-gallery-seo-sync
  cancel-in-progress: false

jobs:
  sync-gallery-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate public photo pages and image sitemap from Supabase
        id: generate
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const html = fs.readFileSync('index.html', 'utf8');
          const urlMatch = html.match(/const SUPABASE_URL\s*=\s*['"]([^'"]+)['"]/);
          const keyMatch = html.match(/const SUPABASE_PUBLISHABLE_KEY\s*=\s*['"]([^'"]+)['"]/);
          if (!urlMatch || !keyMatch) {
            throw new Error('Could not read the public Supabase URL and publishable key from index.html.');
          }
          const supabaseUrl = urlMatch[1].replace(/\/$/, '');
          const publishableKey = keyMatch[1];
          const site = 'https://pusoai.online';

          const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
          }[ch]));
          const cleanText = value => String(value ?? '').replace(/\s+/g, ' ').trim();
          const slugify = value => cleanText(value).normalize('NFKD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 48) || 'pusoai-photo';
          const idSlug = value => String(value ?? '').toLowerCase()
            .replace(/[^a-z0-9_-]+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-+|-+$/g, '')
            .slice(0, 80) || 'item';
          const photoSlug = photo => slugify(photo.name) + '-' + idSlug(photo.id);
          const xmlEscape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'
          }[ch]));
          const safeJson = value => JSON.stringify(value).replace(/</g, '\\u003c');

          async function fetchPublicPhotos() {
            const rows = [];
            const pageSize = 1000;
            for (let offset = 0; ; offset += pageSize) {
              const query = new URLSearchParams({
                select: 'id,name,category,caption,tags,src,media_type,created',
                order: 'created.desc,id.asc'
              });
              const response = await fetch(`${supabaseUrl}/rest/v1/photos?${query}`, {
                headers: {
                  apikey: publishableKey,
                  Authorization: `Bearer ${publishableKey}`,
                  Range: `${offset}-${offset + pageSize - 1}`,
                  Prefer: 'count=exact'
                }
              });
              if (!response.ok) {
                const body = await response.text();
                throw new Error(`Supabase photos query failed: HTTP ${response.status}: ${body.slice(0, 500)}`);
              }
              const batch = await response.json();
              if (!Array.isArray(batch)) throw new Error('Supabase returned an unexpected photos response.');
              rows.push(...batch);
              if (batch.length < pageSize) break;
            }
            return rows;
          }

          const isGenericPhotoName = value =>
            !value || /^(?:community\s+(?:user[- ]?)?(?:photo|upload)|user[- ]?upload|pusoai\s+photo|photo|image|picture|untitled|upload|[.\- _]+)$/i.test(cleanText(value));

          const isGenericCategory = value =>
            !value || /^(?:other|general|uncategorized|photo|photography)$/i.test(cleanText(value));

          function getPhotoText(photo) {
            const candidates = [photo.caption, photo.tags]
              .map(value => cleanText(value)
                .replace(/^(?:instagram\s+prompt|ai\s+image\s+prompt|image\s+prompt|photo\s+prompt|prompt)\s*[:\-]?\s*/i, '')
                .trim())
              .filter(Boolean);
            return candidates.find(value => !/^(?:add|create|upload|edit)\s+[\w ]{1,24}$/i.test(value)) || candidates[0] || '';
          }

          function buildSeoTitle(photo) {
            const original = cleanText(photo.name);
            if (!isGenericPhotoName(original)) return original.slice(0, 58);
            const raw = getPhotoText(photo);
            const lower = raw.toLowerCase();

            if (/\borange\s+cat\b/.test(lower) && /\b(?:window|windowsill|sunlit)\b/.test(lower)) return 'Orange Cat on a Sunlit Windowsill';
            if (/\btata\s+punch\b/.test(lower)) return 'Tata Punch Car Photo';
            if (/(?:t[ -]?shirt|tee shirt)/.test(lower) && /(?:change|colour|color|edit)/.test(lower)) return 'T-Shirt Color Change';
            if (/\bcat\b/.test(lower) && /\bmoney\b/.test(lower)) return 'Cat and Money Image';
            if (/\bred\s+apple\b/.test(lower) || /^\s*red\s+apple\s*$/i.test(raw)) return 'Red Apple Photo';
            if (/\bdog\b/.test(lower)) return 'Dog Photo';
            if (/\bmusic\s+edit\b/.test(lower)) return 'Aesthetic Instagram Music Edit';
            if (/\bgiant\b/.test(lower) && /\bsmartphone\b/.test(lower)) return 'Giant Smartphone Fashion Scene';

            let subject = raw
              .replace(/^(?:please\s+)?(?:create|generate|make|design|edit|add|change)\s+/i, '')
              .replace(/\b(?:ultra[- ]realistic|high[- ]quality|photorealistic|hyper[- ]realistic|cinematic|professional|detailed|eye-level|close-up)\b/gi, ' ')
              .replace(/\b\d+\s*:\s*\d+\b/g, ' ')
              .replace(/\b(?:vertical|horizontal|composition|aspect ratio|uploaded|reference|using|please|create|generate|make|design|photo|image|picture|in|of|the|a|an)\b/gi, ' ')
              .split(/[.!?]/)[0].replace(/[#|]+/g, ' ').replace(/\s+/g, ' ')
              .replace(/^[,\s-]+|[,\s-]+$/g, '').trim();

            const smallWords = new Set(['a', 'an', 'and', 'as', 'at', 'by', 'for', 'in', 'of', 'on', 'or', 'the', 'to', 'with']);
            subject = subject.split(' ').filter(Boolean).slice(0, 7).map((word, index) => {
              if (index > 0 && smallWords.has(word.toLowerCase())) return word.toLowerCase();
              if (/^(?:3d|4k|8k|ai|vr|hd)$/i.test(word)) return word.toUpperCase();
              return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
            }).join(' ').replace(/\bT Shirt\b/gi, 'T-Shirt').trim();

            if (!subject || subject.length < 2) {
              const category = isGenericCategory(photo.category) ? 'Creative' : cleanText(photo.category);
              subject = category + ' Photo';
            }
            return subject.length > 58 ? subject.slice(0, 55).replace(/\s+\S*$/, '') : subject;
          }

          function trimDescription(value, maxLength = 160) {
            const text = cleanText(value);
            if (text.length <= maxLength) return text;
            return text.slice(0, maxLength - 1).replace(/\s+\S*$/, '').replace(/[ ,;:.-]+$/, '') + '…';
          }

          function buildDescription(photo) {
            const title = buildSeoTitle(photo);
            const raw = getPhotoText(photo);
            const lower = raw.toLowerCase();
            const startsAsPrompt = /^(?:please\s+)?(?:create|generate|make|design|edit|add|change)\b/i.test(raw);

            if (raw.length >= 35 && !startsAsPrompt && !/^instagram\s+prompt\b/i.test(raw)) {
              return trimDescription(raw.replace(/[.…\s]+$/, '').trim() + ' — View this photo on PusoAI.');
            }
            if (/\borange\s+cat\b/.test(lower) && /\b(?:window|windowsill|sunlit)\b/.test(lower)) {
              return 'A small orange cat rests on a sunlit windowsill with a leafy garden in the background. View this photo on PusoAI.';
            }
            if (/\btata\s+punch\b/.test(lower)) return 'A Tata Punch car photo in the PusoAI public gallery. Explore more automotive images and creative edits.';
            if (/(?:t[ -]?shirt|tee shirt)/.test(lower) && /(?:change|colour|color|edit)/.test(lower)) {
              return 'A T-shirt color-change edit from the PusoAI public gallery. Explore more fashion photos and creative edits.';
            }
            if (/\bcat\b/.test(lower) && /\bmoney\b/.test(lower)) return 'A creative image featuring a cat and money, shared in the PusoAI public gallery.';
            if (/\bred\s+apple\b/.test(lower) || /^\s*red\s+apple\s*$/i.test(raw)) {
              return 'A red apple image from the PusoAI public gallery. Explore more colorful still-life and creative images.';
            }
            if (/\bdog\b/.test(lower)) return 'A dog photo from the PusoAI public gallery. Explore more animal images and creative photography.';
            if (/\bmusic\s+edit\b/.test(lower)) return 'An aesthetic Instagram music-edit visual from the PusoAI public gallery.';
            if (/\bgiant\b/.test(lower) && /\bsmartphone\b/.test(lower)) {
              return 'A surreal 3D fashion scene featuring a giant modern smartphone, shared in the PusoAI public gallery.';
            }

            const category = isGenericCategory(photo.category) ? 'creative' : cleanText(photo.category).toLowerCase();
            return trimDescription(title + ' is a ' + category + ' image in the PusoAI public gallery. Explore more visual creations on PusoAI.');
          }
          function pageHtml(photo, imageUrl, pageUrl) {
            const name = buildSeoTitle(photo);
            const category = cleanText(photo.category) || 'Other';
            const description = buildDescription(photo);
            const title = `${name} | PusoAI`.slice(0, 70);
            const categoryAlt = isGenericCategory(category) ? '' : ` — ${category}`;
            const imageAlt = `${name}${categoryAlt}. ${description}`;
            const created = photo.created ? new Date(Number(photo.created)).toISOString() : '';
            const jsonLd = {
              '@context': 'https://schema.org',
              '@type': 'ImageObject',
              name,
              caption: description,
              contentUrl: imageUrl,
              url: pageUrl,
              representativeOfPage: true,
              isPartOf: { '@type': 'WebSite', name: 'PusoAI', url: site + '/' }
            };
            if (created) jsonLd.datePublished = created;
            return `<!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="robots" content="index,follow,max-image-preview:large">
          <title>${escapeHtml(title)}</title>
          <meta name="description" content="${escapeHtml(description)}">
          <link rel="canonical" href="${escapeHtml(pageUrl)}">
          <meta property="og:type" content="article">
          <meta property="og:site_name" content="PusoAI">
          <meta property="og:title" content="${escapeHtml(title)}">
          <meta property="og:description" content="${escapeHtml(description)}">
          <meta property="og:url" content="${escapeHtml(pageUrl)}">
          <meta property="og:image" content="${escapeHtml(imageUrl)}">
          <meta property="og:image:alt" content="${escapeHtml(imageAlt)}">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="${escapeHtml(title)}">
          <meta name="twitter:description" content="${escapeHtml(description)}">
          <meta name="twitter:image" content="${escapeHtml(imageUrl)}">
          <script type="application/ld+json">${safeJson(jsonLd)}</script>
          <style>
            :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#0d1220;color:#f4f6ff}
            *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#24204a,#0d1220 55%);padding:24px}
            main{width:min(100%,1000px);margin:0 auto}.brand{font-weight:850;letter-spacing:-.04em;font-size:22px;margin:10px 0 28px}.brand span{color:#897fff}
            article{background:#151a2a;border:1px solid #2c354b;border-radius:22px;overflow:hidden;box-shadow:0 22px 70px #0005}
            img{display:block;width:100%;max-height:78vh;object-fit:contain;background:#080b12}
            .copy{padding:22px 24px 26px}h1{font-size:clamp(24px,4vw,40px);line-height:1.12;margin:0 0 10px;letter-spacing:-.04em}
            p{color:#b4bdd1;line-height:1.7;margin:8px 0} .category{display:inline-block;border:1px solid #4b4b83;background:#29274c;color:#d6d2ff;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:700}
            a{color:#a7c9ff} .cta{display:inline-block;margin-top:18px;padding:11px 16px;border-radius:12px;background:#6c63ff;color:white;text-decoration:none;font-weight:700}
            footer{color:#7f8ba5;font-size:12px;text-align:center;margin:22px 0}
          </style>
          </head>
          <body><main>
            <div class="brand">Puso<span>AI</span></div>
            <article>
              <img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(imageAlt)}" fetchpriority="high">
              <div class="copy">
                <span class="category">${escapeHtml(category)}</span>
                <h1>${escapeHtml(name)}</h1>
                <p>${escapeHtml(description)}</p>
                <a class="cta" href="${site}/#explore">Explore more on PusoAI</a>
              </div>
            </article>
            <footer>Public gallery image on <a href="${site}/">PusoAI</a></footer>
          </main></body></html>`;
          }

          async function main() {
            const rows = await fetchPublicPhotos();
            const images = rows.filter(photo => {
              const type = String(photo.media_type || 'image').toLowerCase();
              if (type !== 'image') return false;
              try { const url = new URL(String(photo.src || '')); return ['http:', 'https:'].includes(url.protocol); }
              catch { return false; }
            });

            const photoRoot = path.join(process.cwd(), 'photos');
            fs.mkdirSync(photoRoot, { recursive: true });
            const desiredPaths = new Set();
            const changedUrls = [];
            const imageUrls = [];
            const sitemapUrls = [];

            for (const photo of images) {
              const slug = photoSlug(photo);
              const relative = path.join('photos', slug, 'index.html');
              const target = path.join(process.cwd(), relative);
              const pageUrl = `${site}/photos/${slug}/`;
              const imageUrl = String(photo.src);
              const htmlPage = pageHtml(photo, imageUrl, pageUrl);
              fs.mkdirSync(path.dirname(target), { recursive: true });
              const previous = fs.existsSync(target) ? fs.readFileSync(target, 'utf8') : null;
              if (previous !== htmlPage) {
                fs.writeFileSync(target, htmlPage);
                changedUrls.push(pageUrl);
              }
              desiredPaths.add(relative);
              sitemapUrls.push({ loc: pageUrl, lastmod: photo.created ? new Date(Number(photo.created)).toISOString().slice(0,10) : '' });
              imageUrls.push({ pageUrl, imageUrl, title: buildSeoTitle(photo), caption: buildDescription(photo) });
            }

            // Remove only generated photo landing pages that no longer have a public photos row.
            if (fs.existsSync(photoRoot)) {
              for (const entry of fs.readdirSync(photoRoot, { withFileTypes: true })) {
                if (!entry.isDirectory()) continue;
                const rel = path.join('photos', entry.name, 'index.html');
                if (!desiredPaths.has(rel)) {
                  const removedUrl = `${site}/photos/${entry.name}/`;
                  fs.rmSync(path.join(photoRoot, entry.name), { recursive: true, force: true });
                  changedUrls.push(removedUrl);
                }
              }
            }

            const baseUrl = `${site}/`;
            const allSitemapUrls = [{ loc: baseUrl, lastmod: new Date().toISOString().slice(0,10) }, ...sitemapUrls];
            const sitemap = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n${allSitemapUrls.map(item => `  <url>\n    <loc>${xmlEscape(item.loc)}</loc>${item.lastmod ? `\n    <lastmod>${item.lastmod}</lastmod>` : ''}\n  </url>`).join('\n')}\n</urlset>\n`;
            fs.writeFileSync('sitemap.xml', sitemap);

            const imageSitemap = `<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9" xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">\n${imageUrls.map(item => `  <url>\n    <loc>${xmlEscape(item.pageUrl)}</loc>\n    <image:image>\n      <image:loc>${xmlEscape(item.imageUrl)}</image:loc>\n      <image:title>${xmlEscape(item.title)}</image:title>\n      <image:caption>${xmlEscape(item.caption)}</image:caption>\n    </image:image>\n  </url>`).join('\n')}\n</urlset>\n`;
            fs.writeFileSync('image-sitemap.xml', imageSitemap);

            fs.writeFileSync('/tmp/pusoai-indexnow-urls.json', JSON.stringify([...new Set(changedUrls)]));
            console.log(`Public images found: ${images.length}`);
            console.log(`Photo pages changed: ${changedUrls.length}`);
            console.log(`Image sitemap entries: ${imageUrls.length}`);
          }

          main().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Commit generated public photo SEO pages and sitemaps
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos sitemap.xml image-sitemap.xml
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SEO page or sitemap changes."
          else
            git commit -m "Sync public gallery SEO pages and image sitemap"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify IndexNow about changed public photo URLs
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          KEY_FILE="$(find . -maxdepth 1 -type f -name '*.txt' | head -n 1)"
          if [ -z "$KEY_FILE" ]; then echo "IndexNow verification key file missing."; exit 1; fi
          KEY="$(tr -d '\r\n' < "$KEY_FILE")"
          KEY_FILENAME="$(basename "$KEY_FILE")"
          if [ "${KEY_FILENAME%.txt}" != "$KEY" ]; then echo "IndexNow key file name and contents do not match."; exit 1; fi
          node <<'NODE'
          const fs = require('node:fs');
          const file = '/tmp/pusoai-indexnow-urls.json';
          const urls = JSON.parse(fs.readFileSync(file, 'utf8'));
          const list = [...new Set(urls)].filter(url => /^https:\/\/pusoai\.online\//.test(url));
          if (!list.includes('https://pusoai.online/')) list.unshift('https://pusoai.online/');
          fs.writeFileSync('/tmp/pusoai-indexnow-batches.json', JSON.stringify(
            Array.from({length: Math.ceil(list.length / 10000)}, (_, i) => list.slice(i * 10000, (i + 1) * 10000))
          ));
          NODE
          export INDEXNOW_KEY="$KEY"
          export INDEXNOW_KEY_LOCATION="$KEY_LOCATION"
          node <<'NODE'
          const fs = require('node:fs');
          const batches = JSON.parse(fs.readFileSync('/tmp/pusoai-indexnow-batches.json', 'utf8'));
          (async () => {
            for (const urlList of batches) {
              const response = await fetch('https://api.indexnow.org/indexnow', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json; charset=utf-8' },
                body: JSON.stringify({
                  host: 'pusoai.online',
                  key: process.env.INDEXNOW_KEY,
                  keyLocation: process.env.INDEXNOW_KEY_LOCATION,
                  urlList
                })
              });
              const body = await response.text();
              console.log(`IndexNow returned HTTP ${response.status}: ${body}`);
              if (![200, 202].includes(response.status)) {
                throw new Error(`IndexNow rejected a URL batch with HTTP ${response.status}`);
              }
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Publish status
        if: always()
        run: echo "Gallery SEO sync finished. See previous steps for photo counts and IndexNow response."
